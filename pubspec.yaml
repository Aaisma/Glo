name: gloclone
description: A new Flutter project.

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9   # or latest version
  lucide_icons: ^0.257.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/sunflower.png
    - assets/images/rose.png
    - assets/images/blue_flower.png
    - assets/images/cactus.png
    - assets/images/purple_flower.png
