name: gloclone
description: A new Flutter project.

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/amazing.png
    - assets/images/tired.png
    - assets/images/happy.png
    - assets/images/calm.png
    - assets/images/void.png
    - assets/images/sad.png
    - assets/images/angry.png
    - assets/images/mood_background.png
    - assets/images/dashboard_bg.png
    - assets/images/flower.png
